      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="shine" x1="8" y1="6" x2="20" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#93c5fd" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#93c5fd" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#0f172a"/>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#bg)"/>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#shine)"/>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="none" stroke="#60a5fa" stroke-opacity="0.35" stroke-width="0.75"/>
  <text
    x="16"
    y="17"
    text-anchor="middle"
    dominant-baseline="central"
    fill="#f8fafc"
